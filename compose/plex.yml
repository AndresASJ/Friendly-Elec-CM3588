name: plex
services:
    plex:
        cpu_shares: 90
        command: []
        container_name: plex
        deploy:
            resources:
                limits:
                    memory: "4294967296"
                reservations:
                    memory: "268435456"
        devices:
            - /dev/dri:/dev/dri
            - /dev/video0:/dev/video0
        environment:
            PGID: "1000"
            PLEX_CLAIM: ""
            PUID: "1000"
            TZ: Etc/UTC
            VERSION: docker
        hostname: plex
        image: lscr.io/linuxserver/plex:latest
        labels:
            icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Plex/icon.png
        network_mode: host
        restart: unless-stopped
        volumes:
            - type: bind
              source: /DATA/AppData/plex/config
              target: /config
            - type: bind
              source: /DATA/AppData/plex/transcode
              target: /transcode
            - type: bind
              source: /DATA/Media
              target: /media
            - type: bind
              source: /mnt/drive1/Downloads/Soulseek
              target: /music
            - type: bind
              source: /mnt/toshiba
              target: /mnt/toshiba
        x-casaos:
            envs:
                - container: PUID
                  description:
                    en_us: Run Plex as specified uid
                - container: PGID
                  description:
                    en_us: Run Plex as specified gid
                - container: TZ
                  description:
                    en_us: TimeZone
                - container: PLEX_CLAIM
                  description:
                    en_us: Claim token from plex.tv/claim (one-time, leave blank after first start)
            ports:
                - container: "32400"
                  description:
                    en_us: Plex Web UI / API Port
            volumes:
                - container: /config
                  description:
                    en_us: Plex configuration and database
                - container: /transcode
                  description:
                    en_us: Temporary transcoding directory
                - container: /media
                  description:
                    en_us: Media library root
networks:
    default:
        name: plex_default
x-casaos:
    architectures:
        - amd64
        - arm64
    author: CasaOS Team
    category: Media
    description:
        en_us: Plex Media Server organizes your personal video, music, and photo collections and streams them to all of your devices. This instance has hardware-accelerated transcoding enabled via Rockchip DRI devices.
    developer: Plex
    hostname: ""
    icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Plex/icon.png
    index: /web
    is_uncontrolled: false
    main: plex
    port_map: "32400"
    scheme: http
    store_app_id: plex
    tagline:
        en_us: Your personal media, beautifully organized.
    thumbnail: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Plex/thumbnail.png
    tips:
        before_install:
            en_us: |
                Get a claim token at https://www.plex.tv/claim/ and set it as
                PLEX_CLAIM before first start. After successful sign-in, clear the
                value — it is saved in /DATA/AppData/plex/config.
    title:
        custom: ""
        en_us: Plex Media Server
